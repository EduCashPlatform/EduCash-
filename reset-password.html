<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset Password — EduCash</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="supabase-client.js"></script></head>
<body><nav><a class="logo" href="index.html">🎓 Edu<span>Cash</span></a></nav><div class="container section"><div class="form" style="margin:auto"><h1>Reset your password</h1><p class="muted">Enter your email and we’ll request a secure password-reset email.</p><input id="email" type="email" placeholder="you@example.com"><button class="btn green" style="width:100%;margin-top:10px" onclick="reset()">Send reset email</button><div id="msg" class="notice" style="display:none"></div></div></div>
<script>async function reset(){const msg=document.getElementById('msg');msg.style.display='block';try{const sb=initSupabase();if(!sb)throw Error('Supabase is not configured.');const {error}=await sb.auth.resetPasswordForEmail(document.getElementById('email').value,{redirectTo:location.origin+'/update-password.html'});if(error)throw error;msg.textContent='If the address is registered, a password reset email will be sent.'}catch(e){msg.textContent=e.message}}</script></body></html>
