<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Set New Password — EduCash</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="supabase-client.js"></script></head>
<body><nav><a class="logo" href="index.html">🎓 Edu<span>Cash</span></a></nav><div class="container section"><div class="form" style="margin:auto"><h1>Set a new password</h1><input id="password" type="password" placeholder="New password"><button class="btn green" style="width:100%;margin-top:10px" onclick="update()">Update password</button><div id="msg" class="notice" style="display:none"></div></div></div>
<script>async function update(){const msg=document.getElementById('msg');msg.style.display='block';try{const sb=initSupabase();if(!sb)throw Error('Supabase is not configured.');const {error}=await sb.auth.updateUser({password:document.getElementById('password').value});if(error)throw error;msg.textContent='Password updated. You can now log in.'}catch(e){msg.textContent=e.message}}</script></body></html>
